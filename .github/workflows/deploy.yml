name: deploy

# Two-stage deploy:
#   1. `build`  — runs on a GitHub-hosted runner and compiles the frontend assets.
#                 Kept OFF the production box on purpose: `npm run build` (Vite) is
#                 memory-hungry and, on the 4 GB server that also runs MySQL, a build
#                 spike triggered the OOM-killer and took MySQL down.
#   2. `deploy` — runs on the self-hosted runner ON the production box, updates the
#                 checkout at /var/www/tabory.barnas.net, and pulls in the prebuilt
#                 assets instead of building them locally.

on:
  push:
    branches:
      - master

# Never let two deploys run at once; queue them instead of clobbering each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      # The Vite build runs `php artisan wayfinder:generate`, so it needs the PHP
      # dependencies and a bootable app (APP_KEY) available here.
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: public/build
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: [self-hosted]
    env:
      DEPLOY_DIR: /var/www/tabory.barnas.net

    steps:
      - name: Pull latest code
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          # Automatic per-run token GitHub injects; lets us pull over HTTPS with no
          # SSH key on the runner. Used inline below so it is never written to .git/config.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --prune "$REPO_URL" "${GITHUB_REF_NAME}"
          # Deterministic deploy: check out the exact commit that was pushed.
          git reset --hard "${GITHUB_SHA}"

      - name: Install PHP dependencies
        working-directory: ${{ env.DEPLOY_DIR }}
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Clear old built assets
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          rm -rf public/build
          mkdir -p public/build
          # A stray `public/hot` (left by `npm run dev`) makes @vite serve assets
          # from a dev server that isn't running in production -> blank page.
          rm -f public/hot

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: build-assets
          path: ${{ env.DEPLOY_DIR }}/public/build

      - name: Migrate database (with backup + auto-restore)
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail

          # Read DB credentials straight from the deployed .env, stripping any quotes.
          get_env() { grep -E "^$1=" .env | head -1 | cut -d '=' -f2- | sed -e 's/^["'\'']//' -e 's/["'\'']$//'; }
          DB_DATABASE=$(get_env DB_DATABASE)
          DB_USERNAME=$(get_env DB_USERNAME)
          DB_PASSWORD=$(get_env DB_PASSWORD)
          DB_HOST=$(get_env DB_HOST); DB_HOST=${DB_HOST:-127.0.0.1}
          DB_PORT=$(get_env DB_PORT); DB_PORT=${DB_PORT:-3306}

          BACKUP_DIR=storage/app/backups
          mkdir -p "$BACKUP_DIR"
          BACKUP_FILE="$BACKUP_DIR/pre-migrate-$(date +%Y%m%d-%H%M%S).sql"

          echo "Backing up '$DB_DATABASE' to $BACKUP_FILE before migrating..."
          mysqldump --no-tablespaces --single-transaction --routines --triggers \
            -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USERNAME" -p"$DB_PASSWORD" \
            "$DB_DATABASE" > "$BACKUP_FILE"

          # If the migration fails, restore the pre-migration snapshot so the
          # database is never left half-migrated, then fail the deploy.
          if ! php artisan migrate --force; then
            echo "::error::Migration failed — restoring database from $BACKUP_FILE"
            mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USERNAME" -p"$DB_PASSWORD" \
              "$DB_DATABASE" < "$BACKUP_FILE"
            exit 1
          fi

          # Prune backups older than 30 days.
          find "$BACKUP_DIR" -name 'pre-migrate-*.sql' -mtime +30 -delete || true

      - name: Rebuild caches
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
