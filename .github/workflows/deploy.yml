name: deploy

# Two-stage deploy:
#   1. `build`  — runs on a GitHub-hosted runner and compiles the frontend assets.
#                 Kept OFF the production box on purpose: `npm run build` (Vite) is
#                 memory-hungry and, on the 4 GB server that also runs MySQL, a build
#                 spike triggered the OOM-killer and took MySQL down.
#   2. `deploy` — runs on the self-hosted runner ON the production box. It builds
#                 each release in its OWN directory and flips an atomic `current`
#                 symlink at the end, so the live server never serves a half-written
#                 tree. This is what fixes the intermittent "A facade root has not
#                 been set" blank pages: those were requests that landed while the
#                 old in-place deploy was rewriting files under a running Apache.
#
# On-box layout (created once, see one-time setup notes in the repo/PR):
#   /var/www/tabory.barnas.net/
#     repo.git/                  bare cache clone (git objects only)
#     releases/<ts>-<sha>/       one dir per deploy
#     shared/.env                the real production env (symlinked into each release)
#     shared/storage/            persistent logs/uploads/sessions (symlinked in)
#     current -> releases/<...>  the symlink Apache's DocumentRoot points at
#
# Apache DocumentRoot must be /var/www/tabory.barnas.net/current/public.

on:
  push:
    branches:
      - master

# Never let two deploys run at once; queue them instead of clobbering each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      # The Vite build runs `php artisan wayfinder:generate`, so it needs the PHP
      # dependencies and a bootable app (APP_KEY) available here.
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Upload built assets
        uses: actions/upload-artifact@v7
        with:
          name: build-assets
          path: public/build
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: [self-hosted]
    env:
      # Base dir that holds repo.git/, releases/, shared/ and the `current` symlink.
      BASE_DIR: /var/www/tabory.barnas.net

    steps:
      - name: Create the release directory from the pushed commit
        env:
          # Automatic per-run token GitHub injects; lets us pull over HTTPS with no
          # SSH key on the runner. Used inline below so it is never written to git config.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          CACHE="${BASE_DIR}/repo.git"

          # A bare object cache avoids a full clone on every deploy. We never add a
          # remote to it, so the tokenised URL is never persisted to disk — each
          # fetch passes it inline instead.
          [ -d "$CACHE" ] || git init --bare -q "$CACHE"
          git --git-dir="$CACHE" fetch --prune "$REPO_URL" \
            "+refs/heads/${GITHUB_REF_NAME}:refs/heads/${GITHUB_REF_NAME}"

          # One immutable directory per deploy, sortable by time and traceable to a SHA.
          RELEASE_DIR="${BASE_DIR}/releases/$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          mkdir -p "$RELEASE_DIR"
          # `git archive` writes a clean tree with no .git/ — the release is a
          # deployable snapshot, not a working checkout.
          git --git-dir="$CACHE" archive "${GITHUB_SHA}" | tar -x -C "$RELEASE_DIR"

          # Expose the path to every later step in this job.
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Link shared env + storage into the release
        run: |
          set -euo pipefail
          # The real production secrets and all persistent state live in shared/ and
          # survive across releases; the release only ever holds code + built assets.
          ln -sfn "${BASE_DIR}/shared/.env"     "${RELEASE_DIR}/.env"
          rm -rf "${RELEASE_DIR}/storage"
          ln -sfn "${BASE_DIR}/shared/storage"  "${RELEASE_DIR}/storage"

      - name: Install PHP dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-dev \
            --optimize-autoloader --working-dir="${RELEASE_DIR}"

      - name: Download built assets
        # Land the prebuilt Vite assets straight into this release's public/build.
        uses: actions/download-artifact@v8
        with:
          name: build-assets
          path: ${{ env.RELEASE_DIR }}/public/build

      - name: Migrate database (with backup + auto-restore)
        working-directory: ${{ env.RELEASE_DIR }}
        run: |
          set -euo pipefail

          # Read DB credentials straight from the (symlinked) shared .env, stripping quotes.
          get_env() { grep -E "^$1=" .env | head -1 | cut -d '=' -f2- | sed -e 's/^["'\'']//' -e 's/["'\'']$//'; }
          DB_DATABASE=$(get_env DB_DATABASE)
          DB_USERNAME=$(get_env DB_USERNAME)
          DB_PASSWORD=$(get_env DB_PASSWORD)
          DB_HOST=$(get_env DB_HOST); DB_HOST=${DB_HOST:-127.0.0.1}
          DB_PORT=$(get_env DB_PORT); DB_PORT=${DB_PORT:-3306}

          # Keep backups OUT of shared/storage: that tree is chowned to www-data
          # for the web runtime (see "Hand runtime-writable state to the web user"),
          # which would then make this step — running as the deploy user — unable to
          # write here. shared/backups is a sibling dir owned by the deploy user and
          # still persists across releases.
          BACKUP_DIR="${BASE_DIR}/shared/backups"
          mkdir -p "$BACKUP_DIR"
          BACKUP_FILE="$BACKUP_DIR/pre-migrate-$(date +%Y%m%d-%H%M%S).sql"

          echo "Backing up '$DB_DATABASE' to $BACKUP_FILE before migrating..."
          mysqldump --no-tablespaces --single-transaction --routines --triggers \
            -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USERNAME" -p"$DB_PASSWORD" \
            "$DB_DATABASE" > "$BACKUP_FILE"

          # If the migration fails, restore the pre-migration snapshot so the
          # database is never left half-migrated, then fail the deploy (no flip).
          if ! php artisan migrate --force; then
            echo "::error::Migration failed — restoring database from $BACKUP_FILE"
            mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USERNAME" -p"$DB_PASSWORD" \
              "$DB_DATABASE" < "$BACKUP_FILE"
            exit 1
          fi

          # Prune backups older than 30 days.
          find "$BACKUP_DIR" -name 'pre-migrate-*.sql' -mtime +30 -delete || true

      - name: Build caches inside the release
        working-directory: ${{ env.RELEASE_DIR }}
        run: |
          set -euo pipefail
          # view:cache writes compiled views into the SHARED storage tree
          # (shared/storage/framework/views), and any artisan warning gets appended to
          # shared/storage/logs/laravel.log. That tree is owned by www-data AND shared
          # with the currently-live release, so it must stay www-data-owned and
          # www-data-writable at all times — the deploy user (tabory) cannot write into
          # it. So run these AS www-data: every file they create is then correctly
          # owned for the web runtime, and Blade's request-time touch() keeps working.
          # config/route cache write into THIS release's bootstrap/cache (owned by the
          # deploy user), so hand that dir to www-data first.
          sudo chown -R www-data:www-data bootstrap/cache
          sudo -u www-data php artisan config:cache
          sudo -u www-data php artisan route:cache
          sudo -u www-data php artisan view:cache

      - name: Hand runtime-writable state to the web user
        run: |
          set -euo pipefail
          # This job runs as the deploy/runner user, but Apache serves as www-data,
          # and Blade `touch()`es its compiled view files at request time. touch()/
          # utime requires *ownership*, not just write permission — so any compiled
          # view left owned by the deploy user makes www-data's touch() fail with
          # "Operation not permitted", 500-ing that page. Give the web user ownership
          # of everything under shared/storage (compiled views, sessions, caches,
          # logs, uploads) so it can freely rewrite them.
          sudo chown -R www-data:www-data "${BASE_DIR}/shared/storage"

      - name: Go live (atomic symlink flip + opcache flush)
        run: |
          set -euo pipefail
          # Atomic swap: build the new symlink under a temp name, then rename it
          # over `current`. rename(2) is atomic, so every request sees either the
          # whole old release or the whole new one — never a mix.
          ln -sfn "${RELEASE_DIR}" "${BASE_DIR}/current.tmp"
          mv -Tf "${BASE_DIR}/current.tmp" "${BASE_DIR}/current"

          # PHP runs as Apache mod_php and opcache caches by resolved path, so
          # recycle the workers to guarantee they serve the new release with a
          # clean opcache. Graceful: in-flight requests finish on the old workers.
          sudo systemctl reload apache2

          # Signal the queue worker (started against .../current/artisan) to
          # restart so it picks up the new code. Harmless if none is running.
          php "${BASE_DIR}/current/artisan" queue:restart

      - name: Prune old releases
        run: |
          set -euo pipefail
          # Keep the 5 most recent releases for fast rollback; delete the rest.
          ls -1dt "${BASE_DIR}/releases/"*/ | tail -n +6 | xargs -r rm -rf
